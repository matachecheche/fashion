artar; Inventario ofrece</text><text x="1602" y="228.965" fill="#000" font-size="13" textLength="232.718">transferir stock antes de reintentar.</text><text x="1602" y="244.098" fill="#000" font-size="13" textLength="387.886">Competencia de varios dispositivos físicos sigue pendiente.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-link-type="dependency"><polygon points="276.902,76.5,267.902,72.5,271.902,76.5,267.902,80.5,276.902,76.5" fill="#52677D" style="stroke:#52677D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M73.136,76.5 C123.125,76.5 213.941,76.5 271.902,76.5" style="stroke:#52677D;stroke-width:1;" fill="none"/><text x="93" y="71.567" fill="#000" font-size="13" textLength="164.258">1. registra venta efectivo</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk10" data-link-type="dependency"><polygon points="638.75,28.5,630.398,23.279,633.799,27.8,629.279,31.201,638.75,28.5" fill="#52677D" style="stroke:#52677D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M361.935,49.843 C371.511,43.962 382.234,38.572 393,35.5 C475.954,11.832 572.035,19.07 633.799,27.8" style="stroke:#52677D;stroke-width:1;" fill="none"/><text x="421.5" y="15.567" fill="#000" font-size="13" textLength="170.416">2. guarda UUID + payload</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk11" data-link-type="dependency"><polygon points="637.76,117.249,628.712,113.358,632.76,117.309,628.809,121.358,637.76,117.249" fill="#52677D" style="stroke:#52677D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M375.228,95.045 C381.147,96.803 387.166,98.353 393,99.5 C476.984,116.008 571.445,118.054 632.76,117.309" style="stroke:#52677D;stroke-width:1;" fill="none"/><text x="426" y="94.567" fill="#000" font-size="13" textLength="161.992">3. reintenta al volver red</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="l