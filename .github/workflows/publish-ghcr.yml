name: Publish public FashionStore images to GHCR

on:
  push:
    branches: [main]
    paths:
      - 'backend-fastapi/**'
      - 'backend-nest/**'
      - 'frontend-web/**'
      - '.github/workflows/publish-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish Linux images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Normalize GHCR owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR for publishing
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish FastAPI image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-fastapi
          file: ./backend-fastapi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/fashionstore-ai:latest
            ghcr.io/${{ steps.owner.outputs.value }}/fashionstore-ai:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish NestJS image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-nest
          file: ./backend-nest/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/fashionstore-api:latest
            ghcr.io/${{ steps.owner.outputs.value }}/fashionstore-api:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and publish web image with same-origin API path
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-web
          file: ./frontend-web/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=/api
            NGINX_CONF=nginx.azure.conf
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/fashionstore-web:latest
            ghcr.io/${{ steps.owner.outputs.value }}/fashionstore-web:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
