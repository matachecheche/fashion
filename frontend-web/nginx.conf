server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy reverso al backend NestJS (red interna de compose: servicio "backend")
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Solo las imágenes de prendas vienen de NestJS; los assets del build (JS/CSS/iconos)
  # viven en /assets/ del propio dist/ y NO deben proxearse.
  location /assets/prendas/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    expires 7d;
  }
}
