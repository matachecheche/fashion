# Compilación Android autónoma en Azure Pipelines.
# El APK se compila como RELEASE (bundle JS incluido), no como debug dependiente de Metro.
trigger: none
pr: none

variables:
  - group: fashionstore-mobile
  - name: ANDROID_HOME
    value: /usr/local/lib/android/sdk
  - name: ANDROID_SDK_ROOT
    value: /usr/local/lib/android/sdk
  - name: NPM_CONFIG_CACHE
    value: $(Pipeline.Workspace)/.npm
  - name: GRADLE_USER_HOME
    value: $(Pipeline.Workspace)/.gradle

pool:
  vmImage: ubuntu-24.04

timeoutInMinutes: 60

steps:
  - checkout: self
    clean: true

  - task: NodeTool@0
    displayName: Use Node.js 20.19 LTS (Expo SDK 54)
    inputs:
      versionSpec: '20.19.x'

  - task: JavaToolInstaller@0
    displayName: Use Java 17 (Android Gradle)
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: x64
      jdkSourceOption: PreInstalled

  - task: Cache@2
    displayName: Restore npm cache
    inputs:
      key: 'fashionstore-mobile-npm | "$(Agent.OS)" | mobile-app/package-lock.json'
      restoreKeys: |
        fashionstore-mobile-npm | "$(Agent.OS)"
      path: $(NPM_CONFIG_CACHE)

  - task: Cache@2
    displayName: Restore Gradle cache
    inputs:
      key: 'fashionstore-mobile-gradle | "$(Agent.OS)" | mobile-app/package-lock.json'
      restoreKeys: |
        fashionstore-mobile-gradle | "$(Agent.OS)"
      path: $(GRADLE_USER_HOME)

  - task: Bash@3
    displayName: Build and verify standalone FashionStore RELEASE APK
    inputs:
      targetType: filePath
      filePath: mobile-app/ci/build-azure-apk.sh
      workingDirectory: $(Build.SourcesDirectory)
    env:
      EXPO_PUBLIC_API_URL: $(EXPO_PUBLIC_API_URL)
      EXPO_PUBLIC_DEFAULT_TENANT_SLUG: legacy
      ANDROID_HOME: $(ANDROID_HOME)
      ANDROID_SDK_ROOT: $(ANDROID_SDK_ROOT)
      NPM_CONFIG_CACHE: $(NPM_CONFIG_CACHE)
      GRADLE_USER_HOME: $(GRADLE_USER_HOME)
      BUILD_ARTIFACTSTAGINGDIRECTORY: $(Build.ArtifactStagingDirectory)/FashionStore-APK
      PIPELINE_WORKSPACE: $(Pipeline.Workspace)
      AGENT_TEMPDIRECTORY: $(Agent.TempDirectory)
      BUILD_BUILDID: $(Build.BuildId)
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      ANDROID_KEYSTORE_BASE64: $(ANDROID_KEYSTORE_BASE64)
      ANDROID_KEYSTORE_PASSWORD: $(ANDROID_KEYSTORE_PASSWORD)
      ANDROID_KEY_ALIAS: $(ANDROID_KEY_ALIAS)
      ANDROID_KEY_PASSWORD: $(ANDROID_KEY_PASSWORD)

  - task: PublishPipelineArtifact@1
    displayName: Publish installable FashionStore APK
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/FashionStore-APK'
      artifact: 'FashionStore-APK'
      publishLocation: pipeline
